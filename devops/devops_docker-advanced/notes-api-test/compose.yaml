services:
  notes:
    build: .
    ports:
      - "${PORT}:4000"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@cache:6379
    depends_on:
      - cache

  cache:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data

volumes:
  redisdata:
