info:
  name: Get One Thread Including Comments
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/threads?page=1&limit=5&author=third author"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "5"
      type: query
    - name: author
      value: third author
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
